<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>abhi Calculator</title>

    <style>

        /* ---------- RESET ---------- */

        * {
            box-sizing: border-box;
        }


        /* ---------- BODY ---------- */

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                120deg,
                #ffce09,
                #ff9f43,
                #feca57,
                #48dbfb
            );

            background-size: 400% 400%;

            animation: backgroundMove 10s ease infinite;

            transition: 0.4s;
        }


        /* Animated background */

        @keyframes backgroundMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* ---------- DARK MODE ---------- */

        body.dark {
            background: linear-gradient(
                120deg,
                #111827,
                #1e293b,
                #312e81,
                #111827
            );

            background-size: 400% 400%;
        }


        /* ---------- CALCULATOR ---------- */

        .calculator {
            width: 350px;
            max-width: 92%;

            padding: 25px;

            background: rgba(255, 247, 237, 0.92);

            border: 2px solid #444;

            border-radius: 22px;

            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.8),
                0 15px 40px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(10px);

            animation: calculatorAppear 0.7s ease;

            transition: 0.4s;
        }


        /* Calculator entrance effect */

        @keyframes calculatorAppear {

            from {
                opacity: 0;
                transform: scale(0.7) translateY(40px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }

        }


        /* ---------- DARK CALCULATOR ---------- */

        body.dark .calculator {
            background: rgba(31, 41, 55, 0.94);

            border-color: #9ca3af;

            color: white;

            box-shadow:
                0 0 25px rgba(96, 165, 250, 0.5),
                0 15px 40px rgba(0, 0, 0, 0.6);
        }


        /* ---------- HEADER ---------- */

        .header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        h1 {
            margin: 0;

            color: #0f766e;

            font-size: 25px;
        }


        body.dark h1 {
            color: #5eead4;
        }


        .subtitle {
            margin-top: 4px;

            font-size: 12px;

            opacity: 0.65;
        }


        /* ---------- THEME BUTTON ---------- */

        #themeBtn {
            width: 42px;
            height: 42px;

            border: 1px solid #444;

            border-radius: 50%;

            background: #fef9c3;

            cursor: pointer;

            font-size: 18px;

            transition: 0.3s;
        }


        #themeBtn:hover {
            transform: rotate(180deg) scale(1.1);
        }


        /* ---------- DISPLAY ---------- */

        .display {
            width: 100%;

            height: 75px;

            padding: 12px 15px;

            margin-bottom: 18px;

            border: 2px solid #444;

            border-radius: 12px;

            background: #e0f2f1;

            font-size: 30px;

            text-align: right;

            outline: none;

            box-shadow:
                inset 0 0 8px rgba(0, 0, 0, 0.15);

            transition: 0.2s;
        }


        body.dark .display {
            background: #111827;

            color: white;

            border-color: #9ca3af;
        }


        /* ---------- BUTTON GRID ---------- */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }


        /* ---------- BUTTONS ---------- */

        button {
            height: 55px;

            border: 1px solid #444;

            border-radius: 10px;

            background: #fef9c3;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s,
                box-shadow 0.15s,
                filter 0.15s;
        }


        /* Hover effect */

        button:hover {
            transform: translateY(-3px);

            filter: brightness(1.05);

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.2);
        }


        /* Click effect */

        button:active {
            transform: scale(0.88);

            box-shadow: none;
        }


        /* ---------- SPECIAL BUTTONS ---------- */

        .operator {
            background: #99f6e4;
        }


        .clear {
            background: #fdba74;
        }


        .equal {
            background: #86efac;

            font-size: 22px;
        }


        .zero {
            grid-column: span 2;
        }


        /* ---------- DARK BUTTONS ---------- */

        body.dark button {
            background: #374151;

            color: white;

            border-color: #9ca3af;
        }


        body.dark .operator {
            background: #0f766e;
        }


        body.dark .clear {
            background: #b45309;
        }


        body.dark .equal {
            background: #15803d;
        }


        /* ---------- RESULT ANIMATION ---------- */

        .result-effect {
            animation: resultEffect 0.25s ease;
        }


        @keyframes resultEffect {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

            100% {
                transform: scale(1);
            }

        }


        /* ---------- MOBILE ---------- */

        @media (max-width: 400px) {

            .calculator {
                padding: 18px;
            }

            button {
                height: 50px;
            }

            .display {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="calculator">

        <!-- Header -->

        <div class="header">

            <div>
                <h1>Calculator</h1>

                <div class="subtitle">
                    Advanced Calculator
                </div>
            </div>

            <button id="themeBtn">
                🌙
            </button>

        </div>


        <!-- Display -->

        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >


        <!-- Buttons -->

        <div class="buttons">

            <button
                class="clear"
                onclick="clearDisplay()">
                AC
            </button>

            <button
                class="clear"
                onclick="backspace()">
                ⌫
            </button>

            <button
                class="operator"
                onclick="percentage()">
                %
            </button>

            <button
                class="operator"
                onclick="add('/')">
                ÷
            </button>


            <button onclick="add('7')">
                7
            </button>

            <button onclick="add('8')">
                8
            </button>

            <button onclick="add('9')">
                9
            </button>

            <button
                class="operator"
                onclick="add('*')">
                ×
            </button>


            <button onclick="add('4')">
                4
            </button>

            <button onclick="add('5')">
                5
            </button>

            <button onclick="add('6')">
                6
            </button>

            <button
                class="operator"
                onclick="add('-')">
                −
            </button>


            <button onclick="add('1')">
                1
            </button>

            <button onclick="add('2')">
                2
            </button>

            <button onclick="add('3')">
                3
            </button>

            <button
                class="operator"
                onclick="add('+')">
                +
            </button>


            <button onclick="changeSign()">
                +/-
            </button>

            <button
                class="zero"
                onclick="add('0')">
                0
            </button>

            <button onclick="add('.')">
                .
            </button>

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <script>

        let expression = "";

        let calculated = false;


        // --------------------------------
        // Add value
        // --------------------------------

        function add(value) {

            if (calculated) {

                expression = "";

                calculated = false;

            }


            // Prevent repeated operators

            if (isOperator(value)) {

                if (expression === "" && value !== "-") {
                    return;
                }


                let last =
                    expression.slice(-1);


                if (isOperator(last)) {

                    expression =
                        expression.slice(0, -1);

                }

            }


            // Decimal validation

            if (value === ".") {

                let parts =
                    expression.split(/[+\-*/]/);

                let current =
                    parts[parts.length - 1];


                if (current.includes(".")) {
                    return;
                }


                if (current === "") {

                    expression += "0";

                }

            }


            expression += value;

            updateDisplay();

        }


        // --------------------------------
        // Calculate
        // --------------------------------

        function calculate() {

            if (expression === "") {
                return;
            }


            try {

                let answer =
                    Function(
                        "return " + expression
                    )();


                if (!Number.isFinite(answer)) {
                    throw new Error();
                }


                expression =
                    Number(
                        answer.toFixed(10)
                    ).toString();


                calculated = true;


                updateDisplay();


                // Result animation

                let display =
                    document.getElementById("display");


                display.classList.remove(
                    "result-effect"
                );


                void display.offsetWidth;


                display.classList.add(
                    "result-effect"
                );

            }

            catch {

                showError();

            }

        }


        // --------------------------------
        // Clear
        // --------------------------------

        function clearDisplay() {

            expression = "";

            calculated = false;

            updateDisplay();

        }


        // --------------------------------
        // Backspace
        // --------------------------------

        function backspace() {

            expression =
                expression.slice(0, -1);

            calculated = false;

            updateDisplay();

        }


        // --------------------------------
        // Percentage
        // --------------------------------

        function percentage() {

            if (expression === "") {
                return;
            }


            try {

                let answer =
                    Function(
                        "return " + expression
                    )();


                expression =
                    (answer / 100).toString();


                updateDisplay();

            }

            catch {

                showError();

            }

        }


        // --------------------------------
        // Positive / Negative
        // --------------------------------

        function changeSign() {

            if (expression === "") {
                return;
            }


            let match =
                expression.match(
                    /(-?\d*\.?\d+)$/
                );


            if (!match) {
                return;
            }


            let number =
                match[0];


            if (number.startsWith("-")) {

                number =
                    number.substring(1);

            }

            else {

                number =
                    "-" + number;

            }


            expression =
                expression.slice(
                    0,
                    -match[0].length
                ) + number;


            updateDisplay();

        }


        // --------------------------------
        // Update display
        // --------------------------------

        function updateDisplay() {

            document.getElementById(
                "display"
            ).value =
                expression || "0";

        }


        // --------------------------------
        // Check operator
        // --------------------------------

        function isOperator(value) {

            return [
                "+",
                "-",
                "*",
                "/"
            ].includes(value);

        }


        // --------------------------------
        // Error
        // --------------------------------

        function showError() {

            let display =
                document.getElementById(
                    "display"
                );


            display.value = "Error";

            expression = "";


            setTimeout(function () {

                display.value = "0";

            }, 1000);

        }


        // --------------------------------
        // Keyboard
        // --------------------------------

        document.addEventListener(
            "keydown",
            function(event) {

                let key = event.key;


                if (
                    (key >= "0" && key <= "9") ||
                    ["+", "-", "*", "/", "."]
                    .includes(key)
                ) {

                    add(key);

                }


                else if (
                    key === "Enter" ||
                    key === "="
                ) {

                    calculate();

                }


                else if (
                    key === "Backspace"
                ) {

                    backspace();

                }


                else if (
                    key === "Escape"
                ) {

                    clearDisplay();

                }


                else if (
                    key === "%"
                ) {

                    percentage();

                }

            }
        );


        // --------------------------------
        // Dark / Light mode
        // --------------------------------

        document.getElementById(
            "themeBtn"
        ).addEventListener(
            "click",
            function() {

                document.body.classList.toggle(
                    "dark"
                );


                if (
                    document.body.classList.contains(
                        "dark"
                    )
                ) {

                    this.textContent = "☀️";

                }

                else {

                    this.textContent = "🌙";

                }

            }
        );

    </script>

</body>

</html>
